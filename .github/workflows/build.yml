name: Build Osiris CSGO
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'csgo-end-of-life'
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Osiris.sln /p:Configuration=Release /p:Platform=Win32
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Osiris-CSGO-DLL
          path: Release/Osiris.dll
